services:
  - type: web
    name: class-draw-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ROOM_CODE
        value: 617CLASS
      - key: ROOM_PASSWORD
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
