<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 그림 퀴즈</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>🎨 우리 반 그림 퀴즈</h1><span id="status">연결 중...</span></header><main><section id="login" class="panel"><h2>우리 반 게임 입장</h2><label>닉네임<input id="name" maxlength="16" placeholder="예: 6학년_민수"></label><label>방 코드<input id="code" placeholder="선생님이 알려준 코드"></label><label>비밀번호<input id="password" type="password" placeholder="선생님이 알려준 비밀번호"></label><label class="check"><input type="checkbox" id="teacher"> 선생님으로 입장</label><button id="join">입장하기</button><p id="loginError" class="error"></p></section><section id="game" hidden><div class="top panel"><div id="phase">대기 중</div><div id="timer">--</div><div id="hint">학생을 기다리는 중</div></div><div class="layout"><section class="panel board"><div class="tools" id="tools" hidden><div id="colors"></div><label>굵기 <input type="range" id="size" min="2" max="25" value="5"></label><button id="eraser" class="secondary">지우개</button><button id="clear" class="secondary">전체 지우기</button></div><div class="canvasWrap"><canvas id="canvas" width="900" height="600"></canvas><div id="overlay" class="overlay" hidden></div></div><div id="teacherTools" class="teacherTools" hidden><button id="start">게임 시작</button><button id="next" class="secondary">현재 문제 넘기기</button><button id="reset" class="danger">대기실로 초기화</button><details><summary>단어 직접 등록 (쉼표 또는 줄바꿈 구분)</summary><textarea id="wordInput" rows="5" placeholder="고양이, 강아지, 피자, 학교..."></textarea><button id="saveWords">단어 적용</button></details></div></section><aside><section class="panel"><h3>🏆 참가자 <span id="count"></span></h3><div id="players"></div></section><section class="panel chatPanel"><h3>💬 정답 입력</h3><div id="messages" aria-live="polite"></div><form id="chatForm"><input id="chatInput" maxlength="80" autocomplete="off" placeholder="정답을 입력하세요"><button>전송</button></form></section></aside></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
